[project]
name = "nazar-contracts"
version = "0.1.0"
description = "Shared NAZAR API/event contracts (source of truth for generated TypeScript types)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/nazar_contracts"]
