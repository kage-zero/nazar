[project]
name = "nazar-media"
version = "0.1.0"
description = "Video probing, frame-quality scoring and keyframe selection (FFmpeg + NumPy)"
requires-python = ">=3.12,<3.13"
dependencies = ["nazar-contracts", "numpy>=2.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/nazar_media"]
