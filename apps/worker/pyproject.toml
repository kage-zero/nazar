[project]
name = "nazar-worker"
version = "0.1.0"
description = "NAZAR reconstruction worker: CPU preprocessing + GPU stage adapters"
requires-python = ">=3.12,<3.13"
# Research-model stacks (Fast3R, Metric3D-v2, SAM2, ...) are NOT dependencies of this
# package. Each runs in its own pinned environment behind a file contract; see
# docs/decisions/ADR-0004-isolated-model-environments.md.
dependencies = [
  "nazar-contracts",
  # Telemetry parsing and ENU conversion (pure numpy).
  "nazar-media",
  # Classical CPU geometry baseline (SIFT + essential matrix + PnP + bundle adjustment).
  "numpy>=2.3",
  "opencv-python-headless>=5.0,<6",
  "scipy>=1.16",
]

[project.scripts]
nazar-worker = "nazar_worker.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nazar_worker"]
