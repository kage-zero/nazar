[project]
name = "nazar-api"
version = "0.1.0"
description = "NAZAR FastAPI service: missions, uploads, job control, events, artifacts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "nazar-contracts",
    "nazar-media",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
nazar-api = "nazar_api.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nazar_api"]
